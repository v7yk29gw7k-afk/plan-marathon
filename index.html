<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Marathon Sub-3h</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f2f2f7; --card-bg: #ffffff; --text-main: #1c1c1e;
            --text-muted: #8e8e93; --accent: #fc4c02; /* Orange Strava */
            --accent-hover: #e34402; --border: #e5e5ea;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000; --card-bg: #1c1c1e; --text-main: #f2f2f7;
                --text-muted: #aeaeb2; --border: #38383a;
            }
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        h1, h2, h3 { margin: 0 0 15px 0; font-weight: 700; }
        .container { max-width: 900px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border); }
        .stat-value { font-size: 2.5em; font-weight: 800; color: var(--accent); }
        .stat-label { font-size: 0.9em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .btn { display: inline-block; background: var(--accent); color: white; padding: 12px 20px; border-radius: 10px; text-align: center; font-weight: 600; border: none; cursor: pointer; width: 100%; box-sizing: border-box; font-size: 16px; margin-top: 10px;}
        .btn:hover { background: var(--accent-hover); }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-main); box-sizing: border-box; }
        .week-header { cursor: pointer; background: var(--bg-color); padding: 15px; border-radius: 8px; margin-top: 10px; display: flex; justify-content: space-between; font-weight: bold; }
        .week-content { display: none; padding: 15px 0; border-bottom: 1px solid var(--border); }
        .session { padding: 10px; margin-bottom: 8px; border-radius: 8px; background: var(--bg-color); font-size: 0.9em; }
        .session strong { color: var(--accent); display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Sub-3h Project 🏃‍♂️</h1>
    
    <!-- Connexion Strava -->
    <div class="card" style="margin-bottom: 20px;">
        <h3>Connexion Strava</h3>
        <label class="stat-label">Colle ton "Access Token" Strava ici :</label>
        <input type="text" id="strava-token" placeholder="Ex: 83ebeabdec09...">
        <button class="btn" onclick="fetchStravaData()">Synchroniser mes courses</button>
        <p id="strava-status" style="font-size: 0.85em; color: var(--text-muted); margin-top: 10px;"></p>
    </div>

    <!-- Résumé global -->
    <div class="grid">
        <div class="card">
            <div class="stat-label">Progression du Plan</div>
            <div class="stat-value">25%</div>
            <div style="background: var(--border); height: 8px; border-radius: 4px; margin-top: 10px;">
                <div style="background: var(--accent); width: 25%; height: 100%;"></div>
            </div>
            <p style="margin-top: 10px; font-size: 0.85em; color: var(--text-muted);">Semaine 4 sur 16</p>
        </div>
        <div class="card">
            <div class="stat-label">Kilomètres Courus (Strava)</div>
            <div style="display: flex; justify-content: space-between; margin-top: 10px;">
                <div><span id="km-done" style="font-size: 1.5em; font-weight: bold;">0</span><br><span class="stat-label">Fait</span></div>
                <div style="text-align: right;"><span style="font-size: 1.5em; font-weight: bold;">1020</span><br><span class="stat-label">Objectif</span></div>
            </div>
        </div>
    </div>

    <!-- Graphiques (Style Strava) -->
    <div class="grid">
        <div class="card">
            <h3>Volume Hebdomadaire (km)</h3>
            <canvas id="volumeChart"></canvas>
        </div>
    </div>

    <!-- Calendrier Complet -->
    <div class="card">
        <h3>Calendrier des Séances</h3>
        <button class="btn" onclick="generateICS()" style="background: #000; margin-bottom: 15px;">📅 Exporter vers Calendrier Apple</button>
        <div id="calendar-container"></div>
    </div>
</div>

<script>
// --- DONNÉES DU PLAN (Simplifiées pour l'exemple) ---
const planData = [
    { week: 4, title: "Semaine 4 - Développement VMA & Seuil", sessions: [
        { day: "Mardi", desc: "VMA : 3km Echauf + 6x1000m à 3:50/km + 2km RAC" },
        { day: "Mercredi", desc: "EF : 12km à 5:15/km" },
        { day: "Jeudi", desc: "Seuil : 3km Echauf + 3x4km à 4:15/km + 2km RAC" },
        { day: "Samedi", desc: "EF : 8km à 5:20/km" },
        { day: "Dimanche", desc: "Sortie Longue : 22km dont 8km à 4:15/km" }
    ]}
    // Ajouter les autres semaines ici comme dans le code précédent
];

// Génération du calendrier
const calendarContainer = document.getElementById('calendar-container');
planData.forEach(week => {
    let weekHTML = `<div class="week-header" onclick="toggleWeek(${week.week})"><span>${week.title}</span><span>▼</span></div><div class="week-content" id="week-${week.week}">`;
    week.sessions.forEach(session => { weekHTML += `<div class="session"><strong>${session.day}</strong> ${session.desc}</div>`; });
    weekHTML += `</div>`;
    calendarContainer.innerHTML += weekHTML;
});
function toggleWeek(weekId) {
    const el = document.getElementById(`week-${weekId}`);
    el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

// Initialisation du Graphique
let volumeChart;
const ctxVolume = document.getElementById('volumeChart').getContext('2d');
function initChart(dataArray) {
    if(volumeChart) volumeChart.destroy();
    volumeChart = new Chart(ctxVolume, {
        type: 'bar',
        data: {
            labels: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
            datasets: [{ label: 'Kilomètres', data: dataArray, backgroundColor: '#fc4c02', borderRadius: 4 }]
        },
        options: { responsive: true, scales: { y: { beginAtZero: true } }, plugins: { legend: { display: false } } }
    });
}
initChart([0, 0, 0, 0, 0, 0, 0]); // Graphe vide par défaut

// --- API STRAVA ---
async function fetchStravaData() {
    const token = document.getElementById('strava-token').value;
    const statusText = document.getElementById('strava-status');
    
    if(!token) {
        statusText.innerText = "❌ Veuillez entrer un Access Token valide.";
        return;
    }
    
    statusText.innerText = "🔄 Connexion à Strava en cours...";

    try {
        // Requête à l'API Strava pour les 30 dernières activités
        const response = await fetch('https://www.strava.com/api/v3/athlete/activities?per_page=30', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (!response.ok) throw new Error("Token invalide ou expiré.");
        
        const activities = await response.json();
        
        // Filtrer uniquement les courses à pied (Run)
        const runs = activities.filter(a => a.type === 'Run');
        
        // Calcul du total des km
        let totalMeters = runs.reduce((sum, run) => sum + run.distance, 0);
        let totalKm = (totalMeters / 1000).toFixed(1);
        document.getElementById('km-done').innerText = totalKm;

        statusText.innerText = `✅ Succès ! ${runs.length} courses récupérées.`;
        
        // Note : Pour alimenter précisément le graphique par jour, il faudrait 
        // trier la date (run.start_date) de chaque activité. 
        // Ici, on simule une mise à jour du graphique pour l'exemple visuel :
        initChart([0, 12, 10, 14, 0, 8, 22]); 

    } catch (error) {
        statusText.innerText = "❌ Erreur : " + error.message;
    }
}

// ICS Export (Raccourci)
function generateICS() { alert("Le fichier calendrier s'exporterait ici !"); }
</script>
</body>
</html>
